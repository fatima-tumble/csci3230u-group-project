<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project Name</title>
        <link rel="stylesheet" href="styles.css" />
   </head>
   
   <body>
        <header class="header">
            <h1>
                <a href="index.html" class="site-title">Project Name</a>
            </h1>
            <nav class="navbar" aria-label="Main">
                <a href="index.html" class="nav-button">Home</a>
                <a href="#categories" class="nav-button">Categories</a>
            </nav>
        </header>

        <main class="home-page">
            <section class="search-section">
                <div class="search-container">
                    <h2>Discover places near you</h2>
                    <form class="location-search" action="results.html" role="search" aria-label="Location search">
                        <label for="city">City or postal code</label>
                        <div class="location-search-row">
                            <input id="city" name="city" type="text" autocomplete="address-level2">
                            <button class="search-button" type="submit">Search</button>
                        </div>
                    </form>
                    <p>Or</p>
                    <button class="location-button">Use my location</button>
                </div>
            </section>

            <section class="categories" id="categories">
                <h2>Explore by category</h2>
                <div class="tag-container" aria-label="Category filters">
                    <a href="index.html?category=food" class="tag filter-tag">Food</a>
                    <a href="index.html?category=entertainment" class="tag filter-tag">Entertainment</a>
                    <a href="index.html?category=attractions" class="tag filter-tag">Attractions</a>
                </div>
            </section>

        </main>
   </body>
</html>
