<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project Name</title>
        <link rel="stylesheet" href="styles.css" />
   </head>
   
   <body>
        <header class="header">
            <h1>Project Name</h1>
            <nav class="navbar">
                <a href="index.html" class="nav-button">Home</a>
                <a href="#categories" class="nav-button">Categories</a>
            </nav>
        </header>

        <main>
            <section class="search-section">
                <div class="search-container">
                    <h2>Discover places near you</h2>
                    <input id="city" type="text" placeholder="City or postal code">
                    <button class="search-button">Search</button>

                    <p>Or</p>
                    <button class="location-button">Use my location</button>
                </div>
            </section>

            <section class="categories" id="categories">
                <h2>Explore by category</h2>
                <div class="tag-container">
                    <span class="tag">Food</span>
                    <span class="tag">Entertainment</span>
                    <span class="tag">Attractions</span>
                </div>
            </section>

        </main>
   </body>
</html>
